name: Test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - run: bundle exec rake test
      - run: bundle exec ruby bench/seed.rb --output tmp/ci-seed
      - run: bundle exec ruby bench/message_hot_paths.rb --seed tmp/ci-seed --iterations 20
